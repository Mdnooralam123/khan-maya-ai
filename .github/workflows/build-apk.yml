name: Build MYRAA Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web UI for Android
        run: npm run build:android
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify web UI
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q './assets/' dist/index.html
          du -sh dist
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and size
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          if [ "$SIZE" -gt 52428800 ]; then echo "WARNING: APK is larger than 50 MiB"; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
